name: Build, test e deploy su Firebase

# Cosa fa:
#   - su ogni pull request verso main: compila e lancia i test (non pubblica)
#   - quando la PR viene mergiata su main (cioe' a ogni push su main):
#     compila, testa e pubblica le regole e gli indici di Firestore, poi
#     Firebase Hosting sul canale "live"
#   - a mano da Actions → "Run workflow", per ripubblicare senza un nuovo commit
#
# Prima di attivare il deploy serve, nelle impostazioni della repo
# (Settings → Secrets and variables → Actions → New repository secret):
#   FIREBASE_SERVICE_ACCOUNT   il JSON della chiave di un service account del
#                              progetto Firebase (vedi README, "Deploy automatico"),
#                              coi ruoli Firebase Hosting Admin, Service Usage
#                              Consumer, Firebase Rules Admin e Cloud Datastore
#                              Index Admin
# Finche' manca, build e test girano lo stesso e il deploy viene saltato con un
# avviso giallo invece di fallire.
#
# Le regole e gli indici di Firestore partono da qui a ogni deploy, prima
# dell'app. Prima andavano lanciati a mano (`npm run deploy:rules`, che resta
# per il primo avvio di un progetto nuovo): Storico della dieta e Promemoria
# sono andati online senza le loro regole, e Firestore rifiutava ogni lettura.
# Ripubblicare regole uguali non cambia niente.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: workout-lab-8c567

# Permessi minimi per tutti i job; il deploy ne aggiunge uno suo.
permissions:
  contents: read

jobs:
  build_and_test:
    name: Build e test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --no-watch

      - name: Build
        run: npm run build -- --configuration production

      # La stessa build che ha passato i test e' quella che va online: il job di
      # deploy la scarica invece di ricompilarla.
      - name: Salva la build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hosting-build
          path: dist/workoutlab/browser
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy su Firebase (regole, indici, Hosting)
    needs: build_and_test
    # Solo dopo il merge (push su main) o a mano: mai sulle pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Un deploy alla volta: due merge ravvicinati si mettono in fila, e quello
    # piu' vecchio non finisce online dopo quello piu' nuovo.
    concurrency:
      group: firebase-hosting-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write
    steps:
      - name: Controlla le credenziali di deploy
        id: credenziali
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::warning title=Deploy saltato::Manca il secret FIREBASE_SERVICE_ACCOUNT (Settings → Secrets and variables → Actions). Build e test sono passati, ma nulla e' stato pubblicato."
            echo "pronte=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronte=true" >> "$GITHUB_OUTPUT"
          fi

      # Serve per firebase.json (regole di cache, rewrite dell'app a pagina
      # singola) e .firebaserc: la build arriva dall'artefatto.
      - name: Checkout
        if: steps.credenziali.outputs.pronte == 'true'
        uses: actions/checkout@v4

      - name: Scarica la build
        if: steps.credenziali.outputs.pronte == 'true'
        uses: actions/download-artifact@v4
        with:
          name: hosting-build
          path: dist/workoutlab/browser

      - name: Setup Node
        if: steps.credenziali.outputs.pronte == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Prima le regole, poi l'app: una versione nuova che legge una raccolta
      # nuova trova gia' le regole che la aprono. Se questo passo fallisce
      # (di solito un ruolo mancante sul service account, vedi l'intestazione)
      # l'app non si pubblica e online resta quella di prima, che con le regole
      # di prima funziona.
      # La chiave si scrive fuori dalla cartella del progetto (RUNNER_TEMP), la
      # legge solo questo passo e si cancella alla fine, anche se fallisce.
      - name: Deploy di regole e indici di Firestore
        if: steps.credenziali.outputs.pronte == 'true'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          credenziali="$RUNNER_TEMP/firebase-deploy.json"
          trap 'rm -f "$credenziali"' EXIT
          (umask 077 && printf '%s' "$SERVICE_ACCOUNT" > "$credenziali")
          GOOGLE_APPLICATION_CREDENTIALS="$credenziali" npx --yes firebase-tools@13 deploy \
            --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Deploy su Firebase Hosting
        if: steps.credenziali.outputs.pronte == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live
