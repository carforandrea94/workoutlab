name: Build, test e deploy su Firebase Hosting

# Cosa fa:
#   - su ogni pull request verso main: compila e lancia i test (non pubblica)
#   - quando la PR viene mergiata su main (cioe' a ogni push su main):
#     compila, testa e pubblica SOLO Firebase Hosting, sul canale "live"
#   - a mano da Actions → "Run workflow", per ripubblicare senza un nuovo commit
#
# Prima di attivare il deploy serve, nelle impostazioni della repo
# (Settings → Secrets and variables → Actions → New repository secret):
#   FIREBASE_SERVICE_ACCOUNT   il JSON della chiave di un service account del
#                              progetto Firebase (vedi README, "Deploy automatico")
# Finche' manca, build e test girano lo stesso e il deploy viene saltato con un
# avviso giallo invece di fallire.
#
# Le regole e gli indici di Firestore NON si pubblicano da qui: quando cambiano
# si lancia a mano `npm run deploy:rules`.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: workout-lab-8c567

# Permessi minimi per tutti i job; il deploy ne aggiunge uno suo.
permissions:
  contents: read

jobs:
  build_and_test:
    name: Build e test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --no-watch

      - name: Build
        run: npm run build -- --configuration production

      # La stessa build che ha passato i test e' quella che va online: il job di
      # deploy la scarica invece di ricompilarla.
      - name: Salva la build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hosting-build
          path: dist/workoutlab/browser
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy su Firebase Hosting
    needs: build_and_test
    # Solo dopo il merge (push su main) o a mano: mai sulle pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Un deploy alla volta: due merge ravvicinati si mettono in fila, e quello
    # piu' vecchio non finisce online dopo quello piu' nuovo.
    concurrency:
      group: firebase-hosting-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write
    steps:
      - name: Controlla le credenziali di deploy
        id: credenziali
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::warning title=Deploy saltato::Manca il secret FIREBASE_SERVICE_ACCOUNT (Settings → Secrets and variables → Actions). Build e test sono passati, ma nulla e' stato pubblicato."
            echo "pronte=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronte=true" >> "$GITHUB_OUTPUT"
          fi

      # Serve per firebase.json (regole di cache, rewrite dell'app a pagina
      # singola) e .firebaserc: la build arriva dall'artefatto.
      - name: Checkout
        if: steps.credenziali.outputs.pronte == 'true'
        uses: actions/checkout@v4

      - name: Scarica la build
        if: steps.credenziali.outputs.pronte == 'true'
        uses: actions/download-artifact@v4
        with:
          name: hosting-build
          path: dist/workoutlab/browser

      - name: Deploy su Firebase Hosting
        if: steps.credenziali.outputs.pronte == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          channelId: live
