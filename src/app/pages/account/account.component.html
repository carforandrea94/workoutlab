<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>
      <div class="navtitle">Account</div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="liste-ios">
  <ion-header collapse="condense" class="ion-no-border">
    <ion-toolbar>
      <ion-title size="large">
        <div class="navtitle">Account</div>
      </ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="wrap">
    <ion-list [inset]="true" class="profilo">
      <ion-item lines="none">
        <ion-avatar slot="start" class="account-avatar">{{ initial }}</ion-avatar>
        <ion-label>
          <h2>{{ auth.currentUser()?.displayName }}</h2>
          <p>{{ auth.currentUser()?.email }}</p>
        </ion-label>
      </ion-item>
    </ion-list>

    <app-forma-card></app-forma-card>

    <!-- Le misure si aprono dal gruppo "Il corpo", nel riassunto qui sopra. -->
    <ion-list [inset]="true" class="voci">
      <ion-item class="voce" [button]="true" [detail]="true" (click)="goToImpostazioni()">
        <ion-avatar slot="start" class="riga-segno icona">
          <app-icona name="settings" [size]="20" [piena]="true"></app-icona>
        </ion-avatar>
        <ion-label class="ion-text-wrap">
          <h2>Impostazioni</h2>
          <p>Tema, dati dell'account e uscita</p>
        </ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
