<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>
      <div class="navtitle">Account</div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense" class="ion-no-border">
    <ion-toolbar>
      <ion-title size="large">
        <div class="navtitle">Account</div>
      </ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="wrap">
    <div class="infocard account-header">
      <div class="badge account-avatar">{{ initial }}</div>
      <div class="info">
        <div class="lbl">{{ auth.currentUser()?.displayName }}</div>
        <div class="meta">{{ auth.currentUser()?.email }}</div>
      </div>
    </div>

    <app-forma-card></app-forma-card>

    <ion-item class="cardrow method-row press-fx" lines="none" [button]="true" (click)="goToImpostazioni()">
      <div class="cardrow-body">
        <div class="method-icon">
          <lucide-icon name="settings" [size]="24"></lucide-icon>
        </div>
        <div class="method-info">
          <div class="method-title">Impostazioni</div>
          <div class="method-sub">Tema, dati dell'account e uscita</div>
        </div>
      </div>
    </ion-item>
  </div>
</ion-content>
