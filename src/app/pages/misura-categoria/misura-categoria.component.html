<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="isEdit ? '/account/misure/storico' : '/account/misure'" aria-label="Indietro"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <div class="navtitle">{{ title }}</div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="wrap">
    <div *ngIf="loading" class="history-empty"><ion-spinner name="crescent" aria-label="Caricamento"></ion-spinner></div>

    <ng-container *ngIf="!loading">
      <!-- Una misura nuova e' sempre di oggi, e il titolo della pagina dice gia' cosa si misura. -->
      <p class="measure-when" *ngIf="!isEdit">Oggi, {{ oggiEsteso }}</p>

      <div class="liste-ios">
        <ion-list [inset]="true" class="campi" *ngIf="isEdit">
          <ion-item>
            <ion-label><label for="misura-data">Data</label></ion-label>
            <input id="misura-data" slot="end" class="data-riga" type="date" [(ngModel)]="dateValue" [max]="maxDate" />
          </ion-item>
        </ion-list>

        <!-- Una riga per misura, come "Aggiungi dati" in Salute: il nome e l'ultima
             volta a sinistra, il valore da scrivere a destra con l'unita'. Toccare
             la riga in un punto qualsiasi mette a fuoco il campo. Prima erano
             riquadri a due colonne, con l'etichetta sopra e l'ultimo valore sotto. -->
        <ion-list [inset]="true" class="campi misure-campi">
          <ion-item *ngFor="let f of fields" (click)="fuocoSulCampo($event)">
            <ion-label>
              <h2>{{ f.label }}</h2>
              <p class="measure-last" *ngIf="ultimo(f) as u">{{ u }}</p>
            </ion-label>
            <ion-input slot="end" class="a-destra misura-valore" type="text" inputmode="decimal"
              [attr.aria-label]="f.label"
              [(ngModel)]="values[f.key]"
              placeholder="—"
              (ionInput)="onInput()">
              <span slot="end" class="unita">{{ f.unit }}</span>
            </ion-input>
          </ion-item>
        </ion-list>
      </div>

      <p class="autherror" *ngIf="errorMsg">{{ errorMsg }}</p>
    </ng-container>
  </div>
</ion-content>

<!-- Il comando principale sta in basso, sotto il pollice, con la scritta: prima era una spunta
     senza testo in alto a destra, la zona piu' lontana dello schermo. Resta spento finche' non
     c'e' niente da salvare, cosi' si vede anche se quello che si e' scritto e' stato preso. -->
<ion-footer *ngIf="!loading" class="salva-footer ion-no-border">
  <div class="salva">
    <ion-button type="button" class="setdone salva-btn" [disabled]="measureState.saving() || !hasAnyValue()" (click)="save()">
      {{ etichettaSalva }}
    </ion-button>
  </div>
</ion-footer>
