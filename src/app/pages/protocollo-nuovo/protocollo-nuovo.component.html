<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/scheda/protocolli" aria-label="Indietro"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <div class="navtitle">Nuovo protocollo</div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="wrap">
    <p class="sectiontitle">Nuovo protocollo</p>

    <ion-list class="grouplist method-list">
      <ion-item class="cardrow method-row press-fx" lines="none" [button]="true" (click)="goToPdfImport()">
        <div class="cardrow-body">
          <div class="method-icon">
            <lucide-icon name="file-text" [size]="24"></lucide-icon>
          </div>
          <div class="method-info">
            <div class="method-title">Carica 3 PDF</div>
            <div class="method-sub">Scheda allenamento, dieta e integrazione — l'app prova a leggerli e precompila il protocollo</div>
          </div>
        </div>
      </ion-item>

      <!-- Mentre il protocollo si crea, al posto del chevron ci sono i puntini. -->
      <ion-item class="cardrow method-row press-fx" lines="none" [button]="true" [detail]="!creating"
        (click)="createManual()">
        <div class="cardrow-body">
          <div class="method-icon">
            <lucide-icon name="square-pen" [size]="24"></lucide-icon>
          </div>
          <div class="method-info">
            <div class="method-title">Crea manualmente</div>
            <div class="method-sub">Costruisci scheda e dieta da zero con le schermate guidate</div>
          </div>
        </div>
        <span class="method-pending" slot="end" *ngIf="creating">…</span>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
