<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>
      <div class="navtitle">Misure</div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button class="navicon" routerLink="/misure/analytics" routerDirection="forward" aria-label="Andamento" title="Andamento">
        <app-icona name="analytics" [size]="18"></app-icona>
      </ion-button>
      <ion-button class="navicon" routerLink="/misure/storico" routerDirection="forward" aria-label="Storico" title="Storico">
        <app-icona name="time" [size]="18"></app-icona>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense" class="ion-no-border">
    <ion-toolbar>
      <ion-title size="large">
        <div class="navtitle">Misure</div>
      </ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="wrap">
    <ion-list class="grouplist">
      <ion-item class="cardrow press-fx" lines="none" [button]="true"
        *ngFor="let c of categories" (click)="goTo(c.id)">
        <div class="cardrow-body">
          <div class="badge">{{ c.badge }}</div>
          <div class="info">
            <div class="lbl">{{ c.label }}</div>
            <div class="meta" *ngIf="riassunto(c.id) as r">{{ r }}</div>
          </div>
        </div>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
