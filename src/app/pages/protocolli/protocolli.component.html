<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/scheda" aria-label="Indietro"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <div class="navtitle">Protocolli</div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="aggiorna($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="wrap">
    <div *ngIf="loading" class="history-empty"><ion-spinner name="crescent" aria-label="Caricamento"></ion-spinner></div>

    <div *ngIf="!loading && errorMsg" class="history-empty">
      {{ errorMsg }}
      <div class="mt-3">
        <ion-button class="confirmbtn cancel" (click)="load()">Riprova</ion-button>
      </div>
    </div>

    <ng-container *ngIf="!loading && !errorMsg">
      <p class="sectiontitle">I tuoi protocolli</p>

      <div *ngIf="protocols.length === 0" class="history-empty">
        Nessun protocollo ancora.<br>Creane uno per avere la tua scheda, la dieta e l'obiettivo di corsa.
      </div>

      <!-- Il nuovo protocollo e' l'ultima riga del gruppo, come "Registra
           un'uscita" nella Corsa: senza protocolli il gruppo ha solo lei. -->
      <div class="grouplist">
        <ion-item-sliding class="cardrow press-fx" *ngFor="let p of protocols" #riga>
          <!-- Qui la riga ha dentro un pulsante (Attiva): un ion-item "button" lo
               anniderebbe in un altro button, quindi la riga e' un item semplice.
               Un protocollo si elimina scorrendo la riga o da dentro, in fondo
               alla scheda Info del builder: li' lo trova anche chi usa lo screen
               reader, e il cestino in ogni riga ripeteva lo scorrimento. -->
          <ion-item lines="none" detail="false" (click)="editProtocol(p)">
            <div class="cardrow-body protocol-row">
              <div class="info">
                <div class="lbl">{{ p.name }}</div>
                <div class="meta">
                  <!-- Lo stato e' un badge come "Prossimo" e "Adesso": pieno se attivo, spento se no. -->
                  <ion-badge class="stato" [class.bozza]="p.status !== 'active'">{{ statusLabel(p) }}</ion-badge>
                  {{ p.source === 'pdf' ? 'da PDF' : 'manuale' }}
                </div>
              </div>
              <ion-button class="attiva-btn tap44" fill="clear" *ngIf="p.status !== 'active'"
                [disabled]="busyId === p.id" (click)="activate(p, $event)" [attr.aria-label]="'Attiva il protocollo ' + p.name">
                {{ busyId === p.id ? '…' : 'Attiva' }}
              </ion-button>
            </div>
          </ion-item>
          <ion-item-options side="end">
            <ion-item-option class="elimina" (click)="riga.close(); remove(p, $event)">Elimina</ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
        <ion-item class="cardrow riga-azione" lines="none" [button]="true" [detail]="false" (click)="newProtocol()">
          <app-icona slot="start" name="add" [size]="22"></app-icona>
          <ion-label>Nuovo protocollo</ion-label>
        </ion-item>
      </div>
    </ng-container>
  </div>
</ion-content>
