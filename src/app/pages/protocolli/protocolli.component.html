<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/scheda" aria-label="Indietro"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <div class="navtitle">Protocolli</div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="aggiorna($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="wrap">
    <div *ngIf="loading" class="history-empty"><ion-spinner name="crescent" aria-label="Caricamento"></ion-spinner></div>

    <div *ngIf="!loading && errorMsg" class="history-empty">
      {{ errorMsg }}
      <div class="mt-3">
        <ion-button class="confirmbtn cancel" (click)="load()">Riprova</ion-button>
      </div>
    </div>

    <ng-container *ngIf="!loading && !errorMsg">
      <div class="savebar mt-0 mb-4">
        <ion-button class="savebtn" (click)="newProtocol()">+ Nuovo protocollo</ion-button>
      </div>

      <p class="sectiontitle">I tuoi protocolli</p>

      <div *ngIf="protocols.length === 0" class="history-empty">
        Nessun protocollo ancora.<br>Creane uno per avere la tua scheda, la dieta e l'obiettivo di corsa.
      </div>

      <div *ngIf="protocols.length > 0" class="grouplist">
        <ion-item-sliding class="cardrow press-fx" *ngFor="let p of protocols" #riga>
          <!-- Qui la riga ha dentro dei pulsanti (Attiva, cestino): un ion-item
               "button" li anniderebbe in un altro button, quindi la riga e' un item
               semplice. Il cestino resta perche' i protocolli non si eliminano da
               nessun'altra parte, e un gesto da solo non lo raggiunge chi usa lo
               screen reader. -->
          <ion-item lines="none" detail="false" (click)="editProtocol(p)">
            <div class="cardrow-body protocol-row">
              <div class="info">
                <div class="lbl">{{ p.name }}</div>
                <div class="meta">
                  <span class="protocol-status" [class]="'ps-' + p.status">{{ statusLabel(p) }}</span>
                  &nbsp;·&nbsp;{{ p.source === 'pdf' ? 'da PDF' : 'manuale' }}
                </div>
              </div>
              <ion-button class="confirmbtn cancel protocol-activatebtn" *ngIf="p.status !== 'active'"
                [disabled]="busyId === p.id" (click)="activate(p, $event)">
                {{ busyId === p.id ? '…' : 'Attiva' }}
              </ion-button>
              <ion-button class="delete-btn tap44" (click)="remove(p, $event)" title="Elimina" [attr.aria-label]="'Elimina il protocollo ' + p.name">
                <app-icona name="trash" [size]="14"></app-icona>
              </ion-button>
            </div>
          </ion-item>
          <ion-item-options side="end">
            <ion-item-option (click)="riga.close(); remove(p, $event)">Elimina</ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      </div>
    </ng-container>
  </div>
</ion-content>
