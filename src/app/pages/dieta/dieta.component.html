<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>
      <div class="navtitle">Dieta</div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button class="navicon" routerLink="/dieta/storico" routerDirection="forward" aria-label="Storico" title="Storico">
        <app-icona name="time" [size]="22"></app-icona>
      </ion-button>
      <ion-button class="navicon" routerLink="/dieta/lista-spesa" routerDirection="forward" aria-label="Lista della spesa" title="Lista della spesa">
        <app-icona name="cart" [size]="22"></app-icona>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- scrollEvents: scorrendo, la barra delle tab si fa piccola (vedi tabs.page.ts). -->
<ion-content [fullscreen]="true" [scrollEvents]="true" class="liste-ios">
  <ion-header collapse="condense" class="ion-no-border">
    <ion-toolbar>
      <ion-title size="large">
        <div class="navtitle">Dieta</div>
      </ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="wrap">
    <div *ngIf="!hasAnyDietData" class="history-empty">
      Non hai ancora un protocollo attivo.<br>
      Creane uno per avere il tuo piano alimentare.
      <div class="mt-3">
        <ion-button class="savebtn" routerLink="/scheda/protocolli" routerDirection="forward">Vai ai protocolli</ion-button>
      </div>
    </div>

    <ng-container *ngIf="hasAnyDietData">
      <ion-list-header class="sezione">
        <ion-label>Piani alimentari<span class="sezione-nota" *ngIf="ciclica">{{ durataCiclo }}</span></ion-label>
      </ion-list-header>
      <!-- ON/OFF: i piani sono alternative, ognuno col suo segno. Ciclica: il
           numero dice il posto nel ciclo, e il piano di oggi e' pieno, col
           badge, come il giorno che tocca nella Scheda. -->
      <ion-list [inset]="true" class="piani">
        <ion-item class="diet-card" *ngFor="let card of cards; let i = index" [button]="true" [detail]="true" (click)="openCard(card)">
          <ion-avatar slot="start" class="riga-segno" [class.icona]="!ciclica" [class.giorno-num]="ciclica" [class.prossimo]="diOggi(i)">
            <app-icona *ngIf="!ciclica" name="restaurant" [size]="20" [piena]="true"></app-icona>
            <ng-container *ngIf="ciclica">{{ i + 1 }}</ng-container>
          </ion-avatar>
          <ion-label>
            <h2>{{ card.plan.name }}</h2>
            <p class="meta">{{ pasti(card) }} · {{ card.itemCount }} alimenti</p>
          </ion-label>
          <ion-badge slot="end" class="stato" *ngIf="diOggi(i)">Oggi</ion-badge>
        </ion-item>
      </ion-list>
      <p class="nota-sotto ciclo-nota" *ngIf="notaCiclo() as nota">{{ nota }}</p>
    </ng-container>
  </div>
</ion-content>
