<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>
      <div class="navtitle">Dieta</div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button class="navicon" routerLink="/dieta/lista-spesa" routerDirection="forward" aria-label="Lista della spesa" title="Lista della spesa">
        <app-icona name="cart" [size]="22"></app-icona>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense" class="ion-no-border">
    <ion-toolbar>
      <ion-title size="large">
        <div class="navtitle">Dieta</div>
      </ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="wrap">
    <div *ngIf="!hasAnyDietData" class="history-empty">
      Non hai ancora un protocollo attivo.<br>
      Creane uno per avere il tuo piano alimentare.
      <div class="mt-3">
        <ion-button class="savebtn" routerLink="/scheda/protocolli" routerDirection="forward">Vai ai protocolli</ion-button>
      </div>
    </div>

    <ng-container *ngIf="hasAnyDietData">
      <p class="sectiontitle">Piani alimentari</p>

      <ion-list class="grouplist">
        <ion-item class="cardrow press-fx diet-card" lines="none" [button]="true"
          *ngFor="let card of cards" (click)="openCard(card)">
          <div class="cardrow-body">
            <div class="badge">
              <app-icona name="restaurant" [size]="18"></app-icona>
            </div>
            <div class="info">
              <div class="lbl">{{ card.plan.name }}</div>
              <div class="meta">{{ pasti(card) }} &nbsp;·&nbsp; {{ card.itemCount }} alimenti</div>
            </div>
          </div>
        </ion-item>
      </ion-list>
    </ng-container>
  </div>
</ion-content>
