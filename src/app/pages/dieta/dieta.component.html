<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>
      <div class="navtitle">Dieta</div>
    </ion-title>
    <ion-buttons slot="end">
      <ion-button class="navicon" routerLink="/dieta/lista-spesa" routerDirection="forward" aria-label="Lista della spesa" title="Lista della spesa">
        <app-icona name="cart" [size]="22"></app-icona>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- scrollEvents: scorrendo, la barra delle tab si fa piccola (vedi tabs.page.ts). -->
<ion-content [fullscreen]="true" [scrollEvents]="true" class="liste-ios">
  <ion-header collapse="condense" class="ion-no-border">
    <ion-toolbar>
      <ion-title size="large">
        <div class="navtitle">Dieta</div>
      </ion-title>
    </ion-toolbar>
  </ion-header>
  <div class="wrap">
    <div *ngIf="!hasAnyDietData" class="history-empty">
      Non hai ancora un protocollo attivo.<br>
      Creane uno per avere il tuo piano alimentare.
      <div class="mt-3">
        <ion-button class="savebtn" routerLink="/scheda/protocolli" routerDirection="forward">Vai ai protocolli</ion-button>
      </div>
    </div>

    <ng-container *ngIf="hasAnyDietData">
      <ion-list-header class="sezione">
        <ion-label>Piani alimentari</ion-label>
      </ion-list-header>
      <ion-list [inset]="true" class="piani">
        <ion-item class="diet-card" *ngFor="let card of cards" [button]="true" [detail]="true" (click)="openCard(card)">
          <ion-avatar slot="start" class="riga-segno icona">
            <app-icona name="restaurant" [size]="20" [piena]="true"></app-icona>
          </ion-avatar>
          <ion-label>
            <h2>{{ card.plan.name }}</h2>
            <p class="meta">{{ pasti(card) }} · {{ card.itemCount }} alimenti</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ng-container>
  </div>
</ion-content>
