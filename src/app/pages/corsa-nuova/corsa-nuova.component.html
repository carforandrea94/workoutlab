<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/corsa" aria-label="Indietro"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <div class="navtitle">Corsa</div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="wrap">
    <p class="sectiontitle">{{ title }}</p>

    <div class="infocard measure-card">
      <div class="measure-field">
        <label>Data</label>
        <div class="measure-input-wrap">
          <input type="date" [(ngModel)]="date" [max]="maxDate" />
        </div>
      </div>

      <div class="measure-field mt-3">
        <label>Minuti corsi</label>
        <div class="measure-input-wrap">
          <ion-input type="text" inputmode="numeric" [(ngModel)]="minutes" placeholder="40"></ion-input>
          <span class="unit">min</span>
        </div>
      </div>

      <div class="runlive">
        <span class="k">Durata</span>
        <span class="v">{{ liveMinutes }}</span>
      </div>
    </div>

    <div class="infocard measure-card">
      <div class="measure-field">
        <label>Tipo di uscita</label>
        <ion-segment class="seg labelseg fullseg" [value]="type" aria-label="Tipo di uscita">
          <ion-segment-button *ngFor="let t of types" [value]="t.id" (click)="type = t.id">{{ t.label }}</ion-segment-button>
        </ion-segment>
      </div>

      <div class="measure-field mt-3">
        <label>Come è andata</label>
        <ion-segment class="seg labelseg fullseg" [value]="effort" aria-label="Come è andata">
          <ion-segment-button *ngFor="let e of efforts" [value]="e.id" (click)="effort = e.id">{{ e.label }}</ion-segment-button>
        </ion-segment>
      </div>

      <div class="measure-field mt-3">
        <label>Note</label>
        <div class="measure-input-wrap">
          <ion-input type="text" [(ngModel)]="note" placeholder="Percorso, sensazioni, meteo…"></ion-input>
        </div>
      </div>
    </div>

    <p class="autherror" *ngIf="errorMsg">{{ errorMsg }}</p>

    <ion-button class="runsave tap44 press-fx" [disabled]="!canSave" (click)="save()">
      {{ saving ? 'Salvataggio…' : (editId ? 'Salva modifiche' : 'Salva uscita') }}
    </ion-button>

    <ion-button class="runremove tap44" *ngIf="editId" [disabled]="saving" (click)="remove()">
      Elimina questa uscita
    </ion-button>
  </div>
</ion-content>
