<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/corsa" aria-label="Indietro"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <div class="navtitle">{{ title }}</div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Un modulo di iOS, come "Aggiungi dati" in Salute: le righe con
       l'etichetta e il valore a destra, le scelte nei segmenti, il salvataggio
       in fondo e la riga rossa per eliminare. -->
  <div class="wrap liste-ios">
    <ion-list [inset]="true" class="campi">
      <ion-item>
        <ion-label><label for="run-date">Data</label></ion-label>
        <input id="run-date" slot="end" class="data-riga" type="date" [(ngModel)]="date" [max]="maxDate" />
      </ion-item>
      <ion-item>
        <ion-input label="Minuti" class="a-destra" type="text" inputmode="numeric" [(ngModel)]="minutes" placeholder="40">
          <span slot="end" class="unita">min</span>
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-label>Durata</ion-label>
        <ion-note slot="end" class="valore" [class.vuoto]="liveMinutes === '—'">{{ liveMinutes }}</ion-note>
      </ion-item>
    </ion-list>

    <ion-list-header class="sezione"><ion-label>Tipo di uscita</ion-label></ion-list-header>
    <ion-segment class="seg labelseg fullseg modulo-seg" [value]="type" aria-label="Tipo di uscita">
      <ion-segment-button *ngFor="let t of types" [value]="t.id" (click)="type = t.id">{{ t.label }}</ion-segment-button>
    </ion-segment>

    <ion-list-header class="sezione"><ion-label>Come è andata</ion-label></ion-list-header>
    <ion-segment class="seg labelseg fullseg modulo-seg" [value]="effort" aria-label="Come è andata">
      <ion-segment-button *ngFor="let e of efforts" [value]="e.id" (click)="effort = e.id">{{ e.label }}</ion-segment-button>
    </ion-segment>

    <ion-list [inset]="true" class="campi">
      <ion-item>
        <ion-input label="Note" [(ngModel)]="note" placeholder="Percorso, sensazioni, meteo…"></ion-input>
      </ion-item>
    </ion-list>

    <p class="autherror" *ngIf="errorMsg">{{ errorMsg }}</p>

    <ion-button class="runsave tap44 press-fx" [disabled]="!canSave" (click)="save()">
      {{ saving ? 'Salvataggio…' : (editId ? 'Salva modifiche' : 'Salva uscita') }}
    </ion-button>

    <ion-list [inset]="true" class="azioni-uscita mt-5" *ngIf="editId">
      <ion-item class="riga-distruttiva" [button]="true" [detail]="false" [disabled]="saving" (click)="remove()">
        <ion-label>Elimina questa uscita</ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
