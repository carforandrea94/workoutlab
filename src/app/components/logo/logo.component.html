     dischi che dal piu' grande al piu' piccolo disegnano l'onda di carico, e il
     monogramma dove si impugna. I dischi prendono l'accento, in tre gradini di
     luce; le lettere il colore del testo, cosi' si leggono in scuro e in
     chiaro; il bilanciere resta in secondo piano. Decorativo: il nome accanto
     al marchio lo dice gia', un secondo annuncio sarebbe rumore per chi usa lo
     screen reader. -->
