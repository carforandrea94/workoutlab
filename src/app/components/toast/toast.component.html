<!-- Per lo screen reader: due regioni sempre presenti, cambia solo il testo. -->
<div class="sr-only" role="status" aria-live="polite">{{ toast.toast()?.kind === 'success' ? toast.toast()!.message : '' }}</div>
<div class="sr-only" role="alert">{{ toast.toast()?.kind === 'error' ? toast.toast()!.message : '' }}</div>

<!-- La pillola di "Recupero finito" (vedi styles.css): resta finche' ToastService
     non la azzera (2,5 s), poi se ne va dissolvendosi. -->
@if (toast.toast(); as t) {
  <div class="apptoast-posto" aria-hidden="true" [style.bottom.px]="basso()" animate.leave="svanisce">
    <p class="apptoast" [class.errore]="t.kind === 'error'">
      <app-icona [name]="t.kind === 'error' ? 'close' : 'checkmark'" [size]="15"></app-icona>{{ t.message }}
    </p>
  </div>
}
