  <script>
    (function () {
      try {
        var cached = localStorage.getItem('themePreference');
        var mode = cached === 'dark' || cached === 'light'
          ? cached
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', mode);
        // La barra di sistema del browser segue il tema scelto dentro l'app.
        // Non basta un <meta media="(prefers-color-scheme: ...)">: la
        // preferenza vive in localStorage e puo' contraddire quella del
        // sistema operativo.
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', mode === 'light' ? '#F5F4F2' : '#0D0E10');
      } catch (e) {
        // localStorage/matchMedia non disponibili (es. modalita' privata): resta sul tema scuro di default.
      }
    })();
  </script>
  <!-- L'intro dell'avvio (#intro, sotto): lo stile sta qui e non in
       styles.css perche' deve esserci al primo fotogramma, prima di qualunque
       file. Il tema e' quello appena scelto dallo script qui sopra.
       Il logo si costruisce davanti agli occhi, come si carica un bilanciere:
       le estremita' della sbarra escono dalla presa, i dischi ci entrano da
       fuori e si fermano uno contro l'altro (prima il piu' grande), poi la W e
       la L si dipingono con una pennellata secca e graffiata: le setole corrono
       nel verso in cui si scrive, con i vuoti del pennello asciutto, e una
       passata piena chiude la lettera. Il pennello e' ritagliato dalla forma
       graffiata della lettera, la stessa dell'icona, che resta ferma. Ogni
       tratto parte nascosto dal suo stroke-dashoffset, scritto in linea con il
       suo tempo, e l'animazione lo porta a zero: niente var() dentro i
       keyframes, che Safari non ha sempre risolto. Poi sotto arriva il nome.
       Lettere del marchio e nome sono in Kanit Bold Italic: il font e' qui
       sotto, in linea e con le sole lettere di "Workout Lab", perche' ci sia
       gia' al primo fotogramma. Finche' la prima pagina non e'
       pronta i dischi si alzano a onda; allora l'intro si dissolve allargandosi
       appena (core/intro.ts, che aspetta almeno la fine della costruzione).
       Il primo fotogramma e' vuoto, solo il fondo: e' quello delle immagini
       d'avvio di iOS (apple-touch-startup-image), e il passaggio non si vede. -->

    html{background:#0D0E10;}
    html[data-theme="light"]{background:#F5F4F2;}
    #intro{position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0D0E10;color:#FFFFFF;transition:opacity .32s cubic-bezier(.23,1,.32,1),transform .32s cubic-bezier(.23,1,.32,1);}
    html[data-theme="light"] #intro{background:#F5F4F2;color:#161A1C;}
    #intro .intro-logo{display:block;width:132px;height:132px;overflow:visible;}
    #intro .intro-sbarra{fill:#6B6E72;transform-box:fill-box;animation:intro-sbarra .34s cubic-bezier(.23,1,.32,1) both;}
    html[data-theme="light"] #intro .intro-sbarra{fill:#8A8C8E;}
    #intro .intro-sbarra.sx{transform-origin:right center;}
    #intro .intro-sbarra.dx{transform-origin:left center;}
    #intro .intro-disco{transform-box:fill-box;transform-origin:center;animation:intro-disco .5s cubic-bezier(.34,1.4,.64,1) .14s both,intro-onda 1.4s cubic-bezier(.45,0,.55,1) 1.6s infinite;}
    #intro .intro-disco.sx{--da:-90px;}
    #intro .intro-disco.dx{--da:90px;}
    #intro .intro-disco.d2{animation-delay:.22s,1.72s;}
    #intro .intro-disco.d3{animation-delay:.3s,1.84s;}
    html[data-theme="light"] #intro .intro-disco{fill:#0A6E91;}
    html[data-theme="light"] #intro .intro-disco.d2{fill-opacity:.78;}
    html[data-theme="light"] #intro .intro-disco.d3{fill-opacity:.56;}
    #intro .intro-lettera{stroke:#FFFFFF;}
    html[data-theme="light"] #intro .intro-lettera{stroke:#161A1C;}
    #intro .intro-setola,#intro .intro-passata{fill:none;stroke-linejoin:round;animation:intro-pennello .5s cubic-bezier(.55,.05,.35,1) .5s both;}
    #intro .intro-setola{stroke-linecap:butt;}
    #intro .intro-passata{stroke-linecap:round;}
    #intro .intro-nome{margin:0;font:italic 700 21px/1.1 "Workout Lab Kanit",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;letter-spacing:-.005em;animation:intro-nome .4s cubic-bezier(.23,1,.32,1) 1s both;}
    #intro.intro-via{opacity:0;transform:scale(1.04);pointer-events:none;}
    @keyframes intro-sbarra{from{transform:scaleX(0);}to{transform:none;}}
    @keyframes intro-disco{from{opacity:0;transform:translateX(var(--da)) scaleY(.55);}to{opacity:1;transform:none;}}
    @keyframes intro-pennello{to{stroke-dashoffset:0;}}
    @keyframes intro-nome{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
    @keyframes intro-onda{0%,60%,100%{transform:scaleY(1);}25%{transform:scaleY(1.1);}}
    @keyframes intro-appare{from{opacity:0;}to{opacity:1;}}
    @media (prefers-reduced-motion:reduce){#intro .intro-sbarra,#intro .intro-disco,#intro .intro-lettera,#intro .intro-nome{animation:intro-appare .3s ease both;}#intro .intro-setola,#intro .intro-passata{animation:none;stroke-dashoffset:0!important;}#intro.intro-via{transform:none;}}
