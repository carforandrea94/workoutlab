  <meta charset="utf-8">
  <meta name="theme-color" content="#0D0E10">
  <script>
    (function () {
      try {
        var cached = localStorage.getItem('themePreference');
        var mode = cached === 'dark' || cached === 'light'
          ? cached
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', mode);
        // La barra di sistema del browser segue il tema scelto dentro l'app.
        // Non basta un <meta media="(prefers-color-scheme: ...)">: la
        // preferenza vive in localStorage e puo' contraddire quella del
        // sistema operativo.
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', mode === 'light' ? '#F5F4F2' : '#0D0E10');
      } catch (e) {
        // localStorage/matchMedia non disponibili (es. modalita' privata): resta sul tema scuro di default.
      }
    })();
  </script>
  <!-- L'intro dell'avvio (#intro, sotto): lo stile sta qui e non in
       styles.css perche' deve esserci al primo fotogramma, prima di qualunque
       file. Il tema e' quello appena scelto dallo script qui sopra. L'icona e'
       quella dell'app, e all'inizio e' ferma: e' lo stesso disegno delle
       immagini d'avvio di iOS (apple-touch-startup-image), cosi' il passaggio
       dall'una all'altra non si vede. Poi arriva il nome e i dischi si alzano a
       onda, dal piu' grande al piu' piccolo, finche' la prima pagina non e'
       pronta; allora l'intro si dissolve allargandosi appena (core/intro.ts). -->
  <style id="intro-stile">
    html{background:#0D0E10;}
    html[data-theme="light"]{background:#F5F4F2;}
    #intro{position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0D0E10;color:#FFFFFF;transition:opacity .32s cubic-bezier(.23,1,.32,1),transform .32s cubic-bezier(.23,1,.32,1);}
    html[data-theme="light"] #intro{background:#F5F4F2;color:#161A1C;}
    #intro .intro-icona{display:block;width:112px;height:112px;border-radius:25px;box-shadow:0 10px 28px rgba(0,0,0,.45);}
    html[data-theme="light"] #intro .intro-icona{box-shadow:0 10px 28px rgba(22,26,28,.16);}
    #intro .intro-nome{margin:0;font:600 17px/1.2 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em;opacity:0;animation:intro-nome .5s .15s cubic-bezier(.23,1,.32,1) forwards;}
    #intro .intro-disco{transform-box:fill-box;transform-origin:center;animation:intro-onda 1.4s cubic-bezier(.45,0,.55,1) infinite;}
    #intro .intro-disco.d2{animation-delay:.12s;}
    #intro .intro-disco.d3{animation-delay:.24s;}
    #intro.intro-via{opacity:0;transform:scale(1.04);pointer-events:none;}
    @keyframes intro-nome{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
    @keyframes intro-onda{0%,60%,100%{transform:scaleY(1);}25%{transform:scaleY(1.1);}}
    @media (prefers-reduced-motion:reduce){#intro .intro-disco{animation:none;}#intro .intro-nome{animation:none;opacity:1;}#intro.intro-via{transform:none;}}
  </style>
