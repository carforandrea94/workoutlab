<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="512" height="512" role="img" aria-label="Workout Lab">
  <!-- WL nella presa: il bilanciere visto di lato, con i dischi che dal piu'
       grande (dentro) al piu' piccolo (fuori) disegnano l'onda di carico, e la
       WL dove si impugna, nel corsivo della scritta (Kanit Bold Italic, le sue
       lettere vere), graffiata come la ghisa di un disco usato: i graffi sono
       tolti dalla forma delle lettere, non disegnati sopra. Il fondo copre tutto il quadrato (iOS e
       Android ci mettono la loro maschera); il disegno sta dentro il cerchio di
       raggio 409,6 attorno al centro, la zona che Android non ritaglia quando
       l'icona e' dichiarata maskable: il punto piu' lontano, la punta del
       bilanciere, e' a 408. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A1E24"/><stop offset="1" stop-color="#0B0C0E"/></linearGradient>
    <linearGradient id="d1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ADBFA"/><stop offset="1" stop-color="#22A6D6"/></linearGradient>
    <linearGradient id="d2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#47C8F0"/><stop offset="1" stop-color="#1A8FC0"/></linearGradient>
    <linearGradient id="d3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2FAEDD"/><stop offset="1" stop-color="#1478A6"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#fondo)"/>
  <!-- il bilanciere si vede solo fuori dai dischi: dentro c'e' il monogramma -->
  <rect x="104" y="494" width="173" height="36" rx="18" fill="#6F7B88"/>
