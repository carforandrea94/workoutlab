<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="32" height="32" role="img" aria-label="Workout Lab">
  <!-- Variante per le misure minute (favicon 16-32 px): un disco solo per
       parte e il monogramma piu' grande e piu' pieno. I dischi a gradini e il
       bilanciere sotto i 32 px si impasterebbero in una macchia. -->
  <rect width="1024" height="1024" fill="#0D0E10"/>
  <rect x="96" y="232" width="130" height="560" rx="56" fill="#35C6F0"/>
  <rect x="798" y="232" width="130" height="560" rx="56" fill="#35C6F0"/>
  <g fill="none" stroke="#F2F5F8" stroke-width="104" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="313,330 311,694 420,520 467,694 593,330"/>
    <polyline points="713,330 649,694 707,694"/>
  </g>
</svg>
