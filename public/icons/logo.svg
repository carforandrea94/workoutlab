<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100" height="100" role="img" aria-label="Workout Lab">
  <!-- Il solo segno, senza fondo: per usarlo su altri supporti. Le lettere sono
       grigio medio, non bianche, perche' qui il fondo non si conosce: su carta
       bianca sparirebbero. Dentro l'app il marchio e' app-logo, che prende i
       colori del tema. -->
  <defs>
    <linearGradient id="d1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ADBFA"/><stop offset="1" stop-color="#22A6D6"/></linearGradient>
    <linearGradient id="d2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#47C8F0"/><stop offset="1" stop-color="#1A8FC0"/></linearGradient>
    <linearGradient id="d3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2FAEDD"/><stop offset="1" stop-color="#1478A6"/></linearGradient>
  </defs>
  <rect x="104" y="494" width="196" height="36" rx="18" fill="#6F7B88"/>
  <rect x="724" y="494" width="196" height="36" rx="18" fill="#6F7B88"/>
  <rect x="241" y="277" width="58" height="470" rx="29" fill="url(#d1)"/>
  <rect x="181" y="332" width="50" height="360" rx="25" fill="url(#d2)"/>
  <rect x="129" y="387" width="42" height="250" rx="21" fill="url(#d3)"/>
  <rect x="725" y="277" width="58" height="470" rx="29" fill="url(#d1)"/>
  <rect x="793" y="332" width="50" height="360" rx="25" fill="url(#d2)"/>
  <rect x="853" y="387" width="42" height="250" rx="21" fill="url(#d3)"/>
  <g fill="none" stroke="#5A6672" stroke-width="66" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="353,392 365,630 450,492 485,630 581,392"/>
    <polyline points="643,392 601,630 671,630"/>
  </g>
</svg>
